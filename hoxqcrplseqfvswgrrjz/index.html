<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stadtplan-Fernrohr</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#eef4f8;font:16px system-ui;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#192635;flex-shrink:0}
h1{font-size:1rem;margin:0}
button{padding:8px 12px;border:0;border-radius:8px;background:#36506a;color:white;font-weight:bold;cursor:pointer;font-size:0.85rem}button:disabled{opacity:.4}#free{background:#23885c}
.stage{flex-grow:1;position:relative;touch-action:none;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;background:#07111ddd;padding:8px 12px;border-radius:9px;pointer-events:none;font-size:0.85rem}
.controls{background:#192635;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.control-row{display:flex;gap:5px}
.pad-btn{width:48px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:#243647}
.action-row{display:flex;gap:6px;align-items:center;margin-top:2px;justify-content:center;width:100%}
.file-label{background:#36506a;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;display:inline-block}
input[type="file"]{display:none}
</style>
<header>
  <h1>Stadtplan-Fernrohr</h1>
  <div style="display:flex;gap:6px;align-items:center;">
    <label class="file-label">📁 Bild wählen<input type="file" id="uploadMap" accept="image/*"></label>
    <button id="reset">Neu</button>
  </div>
</header>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hud"><div id="status">Lade ein Bild oder nutze Test-Plan.</div><div id="count">Befreit: 0 / 0</div></div>
</div>

<div class="controls">
  <div class="control-row">
    <button class="pad-btn" id="move-nw">↖</button>
    <button class="pad-btn" id="move-n">↑</button>
    <button class="pad-btn" id="move-ne">↗</button>
    <button class="pad-btn" id="minus" style="background:#4a366a">Zoom −</button>
  </div>
  <div class="control-row">
    <button class="pad-btn" id="move-w">←</button>
    <button class="pad-btn" id="free" disabled style="width:96px">Befreien</button>
    <button class="pad-btn" id="move-e">→</button>
    <button class="pad-btn" id="plus" style="background:#4a366a">Zoom +</button>
  </div>
  <div class="control-row">
    <button class="pad-btn" id="move-sw">↙</button>
    <button class="pad-btn" id="move-s">↓</button>
    <button class="pad-btn" id="move-se">↘</button>
    <span id="zoom" style="display:flex;align-items:center;padding:0 10px;font-weight:bold;font-size:0.9rem;color:#bdcad6;">1×</span>
  </div>
</div>

<script>
(()=>{
// ==========================================
// 1. HIER KANNST DU DIE KOORDINATEN EINTRAGEN (X und Y)
// ==========================================
const customSpots = [
  { x: 1200, y: 1500 },
  { x: 3000, y: 3000 },
  { x: 4500, y: 3500 },
  { x: 1500, y: 4800 },
  { x: 5000, y: 5000 }
];

const c=document.querySelector('#c'),ctx=c.getContext('2d'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),count=document.querySelector('#count'),free=document.querySelector('#free'),zoomText=document.querySelector('#zoom');

let SIZE_W=6000, SIZE_H=6000; // Standardgrösse, passt sich bei Bild-Upload automatisch an
const SHOW=3.8;
let w=0,h=0,dpr=1,z=.35,x=3000,y=3000,focus=null;
let mapImage=null;
let people=[];

function reset(){
  people=customSpots.map((p,i)=>({x:p.x,y:p.y,name:'Person '+(i+1),freed:false}));
  z=.35; x=SIZE_W/2; y=SIZE_H/2;
  count.textContent='Befreit: 0 / '+people.length;
  draw();
}

function resize(){
  let r=stage.getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1,2);
  w=r.width; h=r.height;
  c.width=w*dpr; c.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function screen(a,b){return [(a-x)*z+w/2,(b-y)*z+h/2]}
function world(a,b){return [(a-w/2)/z+x,(b-h/2)/z+y]}

function map(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,w,h); // Alles ausserhalb des Fernrohrs ist schwarz
  
  let cx=w/2,cy=h/2,r=Math.min(w,h)*.32;
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip(); // Nur im Fernrohr zeichnen

  if(mapImage){
    // ECHTES BILD ZEICHNEN
    let p1 = screen(0, 0);
    let p2 = screen(SIZE_W, SIZE_H);
    ctx.drawImage(mapImage, p1[0], p1[1], (p2[0]-p1[0]), (p2[1]-p1[1]));
  } else {
    // FALLBACK-TEST-KARTENZEICHNUNG (falls kein Bild hochgeladen)
    ctx.fillStyle='#d8d5c7';ctx.fillRect(0,0,w,h);
    let a=world(0,0),b=world(w,h),l=Math.max(0,a[0]),t=Math.max(0,a[1]),r_w=Math.min(SIZE_W,b[0]),bt=Math.min(SIZE_H,b[1]);
    for(let i=0;i<15;i++){
      let p=screen(i*400, i*350);
      ctx.fillStyle='#b8cfa8';ctx.fillRect(p[0],p[1],300*z,250*z);
    }
  }

  // Personen einzeichnen (wenn stark genug gezoomt)
  if(z>=SHOW) people.forEach(drawPerson);
  
  ctx.restore();
}

function drawPerson(p){
  let q=screen(p.x,p.y), r=Math.max(6, 12*z);
  ctx.save();
  ctx.translate(...q);
  
  // Körper / Gesicht der Person
  ctx.fillStyle=p.freed?'#268b60':'#e8b54b';
  ctx.beginPath();ctx.arc(0,-r*0.8,r*0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=p.freed?'#16734b':'#477ca8';
  ctx.fillRect(-r*0.4,-r*0.3,r*0.8,r*1.1);

  // GITTER / KÄFIG (wenn nicht freigelassen)
  if(!p.freed){
    ctx.strokeStyle='#d03030';
    ctx.lineWidth=Math.max(2, z*0.8);
    // Gitterstäbe über die Person legen
    ctx.strokeRect(-r*1.2,-r*1.6,r*2.4,r*2.8);
    for(let k=-0.6;k<=0.6;k+=0.6){
      ctx.beginPath();
      ctx.moveTo(k*r,-r*1.6);
      ctx.lineTo(k*r,r*1.2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function scope(){
  let cx=w/2,cy=h/2,r=Math.min(w,h)*.32;
  ctx.save();
  // Äusserer Fernrohr-Ring
  ctx.strokeStyle='#e0f4ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  // Fadenkreuz in der Mitte
  ctx.lineWidth=1.5;ctx.strokeStyle='#e0f4ffaa';ctx.beginPath();
  ctx.moveTo(cx-r*.15,cy);ctx.lineTo(cx+r*.15,cy);
  ctx.moveTo(cx,cy-r*.15);ctx.lineTo(cx,cy+r*.15);
  ctx.stroke();
  ctx.restore();
}

function update(){
  focus=null;
  if(z>=SHOW){
    let rr=Math.min(w,h)*.32*0.75;
    for(let p of people){
      if(p.freed)continue;
      let q=screen(p.x,p.y);
      if(Math.hypot(q[0]-w/2,q[1]-h/2)<rr){focus=p;break;}
    }
  }
  free.disabled=!focus;
  status.textContent=focus?focus.name+' im Fokuskreis!':z<SHOW?'Zoome näher heran, um das Gitter zu sehen.':'Suche Personen im Stadtplan.';
}

function draw(){if(!w||!h)return;ctx.setTransform(dpr,0,0,dpr,0,0);map();scope();zoomText.textContent=z.toFixed(1)+'×';update();}
function clamp(){x=Math.max(-w/(2*z),Math.min(SIZE_W+w/(2*z),x));y=Math.max(-h/(2*z),Math.min(SIZE_H+h/(2*z),y));}
function zoomAt(n){z=Math.max(.12,Math.min(15,n));clamp();draw();}

// Bild-Upload Event
document.querySelector('#uploadMap').addEventListener('change', (e)=>{
  let file=e.target.files[0];
  if(!file)return;
  let reader=new FileReader();
  reader.onload=(evt)=>{
    let img=new Image();
    img.onload=()=>{
      mapImage=img;
      SIZE_W=img.width;
      SIZE_H=img.height;
      status.textContent="Bild geladen ("+SIZE_W+"x"+SIZE_H+"px)";
      reset();
    };
    img.src=evt.target.result;
  };
  reader.readAsDataURL(file);
});

// Bewegungs-Steuerung per Buttons
const step=10;
document.querySelector('#move-n').onclick=()=>{y-=step/z;clamp();draw();};
document.querySelector('#move-s').onclick=()=>{y+=step/z;clamp();draw();};
document.querySelector('#move-w').onclick=()=>{x-=step/z;clamp();draw();};
document.querySelector('#move-e').onclick=()=>{x+=step/z;clamp();draw();};
document.querySelector('#move-nw').onclick=()=>{x-=step/1.4/z;y-=step/1.4/z;clamp();draw();};
document.querySelector('#move-ne').onclick=()=>{x+=step/1.4/z;y-=step/1.4/z;clamp();draw();};
document.querySelector('#move-sw').onclick=()=>{x-=step/1.4/z;y+=step/1.4/z;clamp();draw();};
document.querySelector('#move-se').onclick=()=>{x+=step/1.4/z;y+=step/1.4/z;clamp();draw();};

document.querySelector('#plus').onclick=()=>zoomAt(z*1.35);
document.querySelector('#minus').onclick=()=>zoomAt(z/1.35);
document.querySelector('#reset').onclick=reset;

free.onclick=()=>{
  if(!focus)return;
  focus.freed=true;
  let n=people.filter(p=>p.freed).length;
  count.textContent='Befreit: '+n+' / '+people.length;
  if(n===people.length)status.textContent='Alle Personen befreit!';
  draw();
};

window.addEventListener('resize',resize);
reset();resize();
})();
</script>
</html>
