<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter-Express – Achterbahn-Challenge</title>
<style>
  :root { color-scheme: dark; --gold:#ffd66b; --ice:#bdeeff; --primary:linear-gradient(135deg, #fff2b5, #ffc94e); }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#fff;
    background:radial-gradient(ellipse at 50% 0%,#285c82 0,#102d4c 48%,#09182c 100%); }
  .game { width:min(100%,1000px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px }
  h1 { margin:0; color:var(--gold); font-size:clamp(1.35rem,3vw,2rem); text-shadow:0 2px 12px #0008 }
  .stats { display:flex; gap:9px; flex-wrap:wrap }
  .pill { background:#ffffff16; border:1px solid #ffffff30; border-radius:999px; padding:8px 13px; font-weight:700; backdrop-filter:blur(4px); }
  canvas { width:100%; display:block; aspect-ratio: 16 / 9; border:2px solid #d4f4ff80; border-radius:18px;
    background:#0b1d33; box-shadow:0 16px 50px #0008; }
  .under { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; margin-top:14px }
  .controls { display:flex; gap:10px; flex-wrap:wrap }
  button { border:0; border-radius:13px; padding:12px 20px; font-size:1rem; font-weight:800; cursor:pointer;
    color:#16314a; background:var(--primary); box-shadow:0 4px 0 #a86b20; transition: transform 0.1s ease; }
  button.secondary { background:linear-gradient(135deg, #d8f7ff, #7ed5f4); box-shadow:0 4px 0 #327f9a; color:#102d4c; }
  button.action-jump { background:linear-gradient(135deg, #ffd1dc, #ff8fa3); box-shadow:0 4px 0 #9e2a3b; color:#4a1015; }
  button:active { transform:translateY(3px); box-shadow:none }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .hint { color:#d7eefa; font-size:.92rem; line-height:1.4 }
  .uploads { margin-top:14px; padding:12px 14px; border:1px solid #ffffff30; border-radius:14px; background:#ffffff0d; }
  .uploads strong { display:block; margin-bottom:8px; color:var(--ice) }
  .uploadrow { display:flex; gap:16px; flex-wrap:wrap; align-items:center }
  label { font-size:.9rem; color:#e6f6ff }
  input { display:block; max-width:230px; margin-top:4px; font-size:.82rem }
  .message { min-height:1.5em; margin:10px 2px 0; color:var(--gold); font-weight:700 }
  @media(max-width:750px) { .under { grid-template-columns:1fr } .controls { justify-content:center } }
</style>
</head>
<body>
<main class="game">
  <header>
    <h1>🎢 Winter-Achterbahn</h1>
    <div class="stats">
      <div class="pill">⭐ Gesammelt: <span id="score">0</span>/20</div>
      <div class="pill">🏁 Strecke: <span id="distance">0</span> m</div>
    </div>
  </header>
  <canvas id="game" width="960" height="540" aria-label="Achterbahn-Spiel"></canvas>
  <div class="under">
    <div class="controls">
      <button id="startBtn">Los geht's</button>
      <button id="up" class="secondary" disabled>⬆ Hinauf</button>
      <button id="down" disabled>⬇ Hinunter</button>
      <button id="jumpBtn" class="action-jump" disabled>🦘 Sprung</button>
      <button id="restart" class="secondary">↻ Neustart</button>
    </div>
    <div class="hint">Fantasievoller, detailreicher Winterhimmel mit Parallax-Tannenwäldern!<br>
      Kleine Lücken per Sprung-Button meistern, große Abgründe umfahren.</div>
  </div>
  <div class="uploads">
    <strong>Eigene JPG-Bilder verwenden (optional)</strong>
    <div class="uploadrow">
      <label>Eigener Schlitten/Figur (JPG)<input id="playerFile" type="file" accept="image/jpeg,image/jpg"></label>
      <label>Gute Bilder (Geschenke)<input id="goodFiles" type="file" accept="image/jpeg,image/jpg" multiple></label>
      <label>Böse Bilder (Hindernisse)<input id="badFiles" type="file" accept="image/jpeg,image/jpg" multiple></label>
    </div>
  </div>
  <div class="message" id="message">Bereit? Klicke auf „Los geht's“, um die Fahrt zu starten!</div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, scoreEl = document.getElementById('score'),
    distEl = document.getElementById('distance'), msg = document.getElementById('message');
  const startBtn = document.getElementById('startBtn'), upBtn = document.getElementById('up'), 
        downBtn = document.getElementById('down'), jumpBtn = document.getElementById('jumpBtn');
  let goodImages = [], badImages = [];
  let customPlayerImg = null;

  function loadFiles(input, target) {
    target.length = 0;
    [...input.files].forEach(file => { const url = URL.createObjectURL(file), im = new Image(); im.src = url; target.push(im); });
  }
  document.getElementById('goodFiles').addEventListener('change', e => loadFiles(e.target, goodImages));
  document.getElementById('badFiles').addEventListener('change', e => loadFiles(e.target, badImages));

  document.getElementById('playerFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file), im = new Image();
      im.src = url;
      customPlayerImg = im;
    }
  });

  const positions = [
    { rail: 0, isHanging: true,  label: 'Untere Schiene · unten hängend' },
    { rail: 0, isHanging: false, label: 'Untere Schiene · oben fahrend' },
    { rail: 1, isHanging: true,  label: 'Obere Schiene · verkehrt hängend' },
    { rail: 1, isHanging: false, label: 'Obere Schiene · oben fahrend' }
  ];

  let playerPos = 1;
  let score = 0, distance = 0, objects = [], frame = 0, running = false, won = false;
  let fallingState = null;
  let jumpState = null;
  let activeGapJump = false; 
  const player = { x: 210 };
  let seedOffset = Math.random() * 10000;

  function getSpeed() {
    return Math.min(8.5, 5.0 + (distance / 2000));
  }

  function trackY(x, rail) {
    const worldX = x + distance + seedOffset;
    const base = rail === 0 ? 410 : 160;
    const wave1 = Math.sin(worldX / 150) * 85;
    const wave2 = Math.cos(worldX / 75) * 35;
    const wave3 = Math.sin(worldX / 280) * 60;
    return base + wave1 + wave2 + wave3;
  }

  function trackSlope(x, rail) {
    const eps = 2;
    const y1 = trackY(x - eps, rail);
    const y2 = trackY(x + eps, rail);
    return (y2 - y1) / (eps * 2);
  }

  function getRailGapType(worldX, rail) {
    const mod = (worldX + seedOffset + (rail * 400)) % 2200;
    if (mod > 1300 && mod < 1380) return 'short';
    if (mod > 1850 && mod < 1960) return 'long';
    return null;
  }

  function getTargetY(posIndex) {
    const p = positions[posIndex], railY = trackY(player.x, p.rail);
    return railY + (p.isHanging ? 25 : -25);
  }

  function currentY() {
    if (fallingState) return fallingState.y;
    if (jumpState) {
      const currentBaseY = jumpState.startY + (jumpState.targetY - jumpState.startY) * jumpState.progress;
      const arc = Math.sin(jumpState.progress * Math.PI) * (jumpState.isGapJump ? -85 : -40);
      return currentBaseY + arc;
    }
    return getTargetY(playerPos);
  }

  function objectY(obj) {
    return trackY(obj.x, obj.rail) + obj.side * 25;
  }

  function makeObject() {
    const good = Math.random() < 0.7, rail = Math.random() < 0.5 ? 0 : 1;
    const side = Math.random() < 0.5 ? -1 : 1;
    const worldX = W + distance;
    if (getRailGapType(worldX, rail)) return;

    objects.push({
      x: W + 30, rail, side, good, hit: false,
      image: good ? (goodImages.length ? goodImages[Math.floor(Math.random() * goodImages.length)] : null)
                  : (badImages.length ? badImages[Math.floor(Math.random() * badImages.length)] : null)
    });
  }

  function roundedRect(x, y, w, h, r, fill) {
    ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  }

  // Fantasy-Hintergrund mit Parallax-Effekt für Tannen, Berge und Wolken
  function drawBackground() {
    // 1. Magischer Abend-/Winterhimmel (Verlauf)
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#091528');
    skyGrad.addColorStop(0.5, '#183863');
    skyGrad.addColorStop(1, '#3b6e94');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. Glitzernde Sterne & Schneeflocken im Hintergrund
    for (let i = 0; i < 80; i++) {
      let x = ((i * 137 - distance * 0.15) % W + W) % W;
      let y = (i * 59) % 320;
      let alpha = 0.3 + Math.sin(frame * 0.05 + i) * 0.3;
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, alpha)})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.2 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }

    // 3. Ferne Wolkenschicht (langsam)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    for (let i = 0; i < 5; i++) {
      let wx = ((i * 280 - distance * 0.25) % (W + 300) + W + 300) % (W + 300) - 150;
      let wy = 80 + (i % 3) * 45;
      ctx.beginPath();
      ctx.ellipse(wx, wy, 110, 35, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Entfernte schneebedeckte Bergkette
    ctx.fillStyle = '#27496d';
    ctx.beginPath();
    ctx.moveTo(0, 310);
    for (let x = 0; x <= W + 40; x += 50) {
      let hOffset = Math.sin((x + distance * 0.3) * 0.01) * 45;
      ctx.lineTo(x, 260 + hOffset);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

    // 5. Nahe Tannenwald-Schicht (mittlere Tiefe)
    for (let i = 0; i < 16; i++) {
      let x = ((i * 90 - distance * 0.45) % (W + 120) + W + 120) % (W + 120) - 40;
      let y = 320 + (i % 4) * 18;
      ctx.fillStyle = '#163b45';
      ctx.beginPath();
      ctx.moveTo(x, y - 80);
      ctx.lineTo(x - 32, y + 10);
      ctx.lineTo(x + 32, y + 10);
      ctx.fill();
      // Schneekappe auf Tannen
      ctx.fillStyle = '#eaf6f8';
      ctx.beginPath();
      ctx.moveTo(x, y - 80);
      ctx.lineTo(x - 14, y - 45);
      ctx.lineTo(x + 14, y - 45);
      ctx.fill();
    }

    // 6. Vorderster, sanfter Schneehügel (Hintergrund vor den Schienen)
    ctx.fillStyle = '#e3f3ff';
    ctx.beginPath();
    ctx.moveTo(0, 410);
    for (let x = 0; x <= W; x += 25) {
      ctx.lineTo(x, 370 + Math.sin((x + distance * 0.6) / 85) * 30);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  }

  function drawContinuousOrGappedRail(rail, yOffset) {
    let drawing = false;
    for (let x = 0; x <= W; x += 6) {
      const worldX = x + distance;
      if (getRailGapType(worldX, rail)) {
        if (drawing) { ctx.stroke(); drawing = false; }
      } else {
        let y = trackY(x, rail) + yOffset;
        if (!drawing) {
          ctx.beginPath(); ctx.moveTo(x, y); drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
    }
    if (drawing) ctx.stroke();
  }

  function drawTracks() {
    for (let rail = 0; rail < 2; rail++) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1b3144'; ctx.lineWidth = 16;
      drawContinuousOrGappedRail(rail, 0);

      ctx.strokeStyle = rail === 0 ? '#ffd36b' : '#a9efff'; ctx.lineWidth = 8;
      drawContinuousOrGappedRail(rail, 0);

      ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2;
      drawContinuousOrGappedRail(rail, 8);
    }
  }

  function drawImageOrToken(obj, x, y) {
    const im = obj.image;
    if (im && im.complete && im.naturalWidth) {
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(im, x - 25, y - 25, 50, 50); ctx.restore();
      ctx.strokeStyle = obj.good ? '#ffe27c' : '#ff7c83'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = obj.good ? '#ffdc67' : '#e96e7a'; ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = '28px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(obj.good ? '★' : '✖', 0, 1); ctx.restore();
    }
  }

  function drawPlayer() {
    const p = positions[playerPos], y = currentY();
    ctx.save();
    ctx.translate(player.x, y);
    
    if (fallingState) {
      ctx.rotate(fallingState.timer * 0.15);
    } else if (jumpState) {
      ctx.rotate(jumpState.progress * Math.PI * 0.5);
    } else {
		 const slope = trackSlope(player.x, p.rail);
		let angle = Math.atan(slope);
		ctx.rotate(angle);
		if (p.isHanging) {
		  ctx.scale(1, -1); // <-- Das spiegelt den Schlitten sauber vertikal
		}
    }

    if (customPlayerImg && customPlayerImg.complete && customPlayerImg.naturalWidth) {
      const sz = 100;
      ctx.drawImage(customPlayerImg, -sz / 2, -sz / 2, sz, sz);
    } else {
      ctx.fillStyle = '#b83b3b';
      ctx.beginPath();
      ctx.roundRect(-28, -12, 56, 22, 8);
      ctx.fill();
      ctx.strokeStyle = '#ffd66b';
      ctx.lineWidth = 3;
      ctx.stroke();

      if (!fallingState && !jumpState) {
        ctx.strokeStyle = '#a8c5da';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(0, p.isHanging ? 25 : -25);
        ctx.stroke();
      }

      ctx.fillStyle = '#2a75bc';
      ctx.beginPath();
      ctx.roundRect(-16, -32, 32, 24, 6);
      ctx.fill();

      ctx.fillStyle = '#ffd1b3';
      ctx.beginPath();
      ctx.arc(6, -40, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.arc(6, -44, 12, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(14, -54, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#102c4a';
      ctx.beginPath();
      ctx.arc(10, -41, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (!fallingState && !jumpState) {
      ctx.fillStyle = '#17334b';
      ctx.font = 'bold 15px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(p.label, 18, 30);
    }
  }

  function update() {
    if (!running) return;
    const currentSpeed = getSpeed();

    if (jumpState) {
      jumpState.progress += jumpState.isGapJump ? 0.055 : 0.15;
      if (jumpState.progress >= 1) {
        jumpState = null;
        activeGapJump = false;
      }
    }

    if (fallingState) {
      fallingState.y += fallingState.vy;
      fallingState.vy += 0.6;
      fallingState.timer++;

      if (fallingState.type === 'lower') {
        const targetRailY = trackY(player.x, 0);
        if (fallingState.y >= targetRailY - 25) {
          playerPos = 1;
          fallingState = null;
          msg.textContent = 'Puh! Auf der unteren Schiene gelandet!';
        }
      } else if (fallingState.type === 'snow') {
        if (fallingState.y > H + 50) {
          running = false;
          fallingState = null;
          score = 0;
          scoreEl.textContent = score;
          
          distance = 0;
          objects = [];
          seedOffset = Math.random() * 10000;
          playerPos = 1;

          startBtn.textContent = 'Los geht\'s';
          startBtn.disabled = false;
          upBtn.disabled = true;
          downBtn.disabled = true;
          jumpBtn.disabled = true;
          msg.textContent = 'In den Tiefschnee gestürzt! Neue Strecke bereit – klicke auf Los geht\'s.';
        }
      }
      return;
    }

    frame++; distance += currentSpeed; distEl.textContent = Math.floor(distance / 10);
    if (frame % Math.max(25, Math.floor(55 - currentSpeed * 4)) === 0 && objects.length < 9) makeObject();
    
    objects.forEach(o => o.x -= currentSpeed);
    objects = objects.filter(o => o.x > -45);

    const p = positions[playerPos];
    const playerWorldX = player.x + distance;

    const gapType = getRailGapType(playerWorldX, p.rail);

    if (!jumpState && gapType) {
      if (gapType === 'short') {
        if (activeGapJump) {
          // Drüber gesprungen!
        } else {
          triggerFall(p.rail);
        }
      } else if (gapType === 'long') {
        triggerFall(p.rail, 'Zu lang! Der Sprung reicht hier nicht aus!');
      }
    }

    const py = currentY();
    for (const o of objects) {
      const oy = objectY(o);
      if (!o.hit && Math.abs(o.x - player.x) < 38 &&
         o.rail === p.rail && o.side === (p.isHanging ? 1 : -1) &&
         Math.abs(oy - py) < 28) {
        o.hit = true;
        if (o.good) {
          score = Math.min(20, score + 1);
          msg.textContent = 'Gut gemacht! Ein Fundstück eingesammelt.';
        } else {
          score = 0;
          msg.textContent = 'Auweia! Hindernis getroffen – weiter geht\'s!';
        }
        scoreEl.textContent = score;
        if (score >= 20) {
          won = true; running = false;
          distance = 0;
          objects = [];
          seedOffset = Math.random() * 10000;
          playerPos = 1;
          startBtn.textContent = 'Los geht\'s';
          startBtn.disabled = false;
          upBtn.disabled = true;
          downBtn.disabled = true;
          jumpBtn.disabled = true;
          msg.textContent = 'Geschafft! Du hast 20 gute Bilder gesammelt!';
        }
      }
    }
  }

  function triggerFall(rail, customText) {
    const p = positions[playerPos];
    if (p.rail === 1) {
      fallingState = { type: 'lower', y: currentY(), vy: 2, timer: 0 };
      msg.textContent = customText || 'Abflug! Fall zur unteren Schiene...';
    } else {
      fallingState = { type: 'snow', y: currentY(), vy: 1, timer: 0 };
      msg.textContent = customText || 'In den Tiefschnee gestürzt!';
    }
  }

  function draw() {
    drawBackground(); drawTracks();
    objects.forEach(o => { if (!o.hit) drawImageOrToken(o, o.x, objectY(o)); });
    drawPlayer();
    roundedRect(W - 190, 18, 165, 14, 7, '#17334b99');
    roundedRect(W - 190, 18, 165 * (score / 20), 14, 7, '#ffd66b');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'right'; ctx.fillText('ZIEL: 20', W - 25, 48);
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  
  function startGame() {
    running = true; won = false; fallingState = null; jumpState = null; activeGapJump = false;
    startBtn.textContent = 'Läuft...';
    startBtn.disabled = true;
    upBtn.disabled = false;
    downBtn.disabled = false;
    jumpBtn.disabled = false;
    msg.textContent = 'Fahrt gestartet! Viel Erfolg!';
  }

  function triggerLaneJump(newPos) {
    if (!running || fallingState || jumpState) return;
    const startY = currentY();
    playerPos = newPos;
    const targetY = currentY();
    jumpState = { startY, targetY, progress: 0, isGapJump: false };
  }

  function triggerActionJump() {
    if (!running || fallingState || jumpState) return;
    const startY = currentY();
    const targetY = startY;
    activeGapJump = true;
    jumpState = { startY, targetY, progress: 0, isGapJump: true };
    msg.textContent = 'Perfekter Sprung über die kurze Lücke!';
  }

  function moveUp() { if (running && !fallingState && playerPos < 3) triggerLaneJump(playerPos + 1); }
  function moveDown() { if (running && !fallingState && playerPos > 0) triggerLaneJump(playerPos - 1); }

  startBtn.addEventListener('click', startGame);
  upBtn.addEventListener('click', moveUp);
  downBtn.addEventListener('click', moveDown);
  jumpBtn.addEventListener('click', triggerActionJump);
  
  document.addEventListener('keydown', e => {
    if (!running) {
      if (e.key === ' ' || e.key === 'Enter') startGame();
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'w') moveUp();
    if (e.key === 'ArrowDown' || e.key === 's') moveDown();
    if (e.key === ' ' || e.key === 'j' || e.key === 'J') triggerActionJump();
  });

  document.getElementById('restart').addEventListener('click', () => {
    running = false;
    fallingState = null;
    jumpState = null;
    activeGapJump = false;
    score = 0;
    distance = 0;
    objects = [];
    seedOffset = Math.random() * 10000;
    playerPos = 1;
    scoreEl.textContent = '0';
    distEl.textContent = '0';
    startBtn.textContent = 'Los geht\'s';
    startBtn.disabled = false;
    upBtn.disabled = true;
    downBtn.disabled = true;
    jumpBtn.disabled = true;
    msg.textContent = 'Bereit? Klicke auf „Los geht\'s“, um die Fahrt zu starten!';
  });

  draw();
  loop();
})();
</script>
</body>
</html>
